<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .column {
      background: white;
      border-radius: 10px;
      padding: 10px;
      min-height: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .column h4 {
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <h1 class="text-center mb-4">📋 Gestor de Tareas</h1>

    <!-- Formulario -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5>Nueva Tarea</h5>
      <input id="title" class="form-control mb-2" placeholder="Título">
      <input id="description" class="form-control mb-2" placeholder="Descripción">
      <button onclick="crearTarea()" class="btn btn-success">Agregar</button>
    </div>

    <!-- Tablero -->
    <div class="row text-center">
      <div class="col-md-4">
        <div class="column">
          <h4>📝 To-Do</h4>
          <div id="todo"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="column">
          <h4>⚙️ Doing</h4>
          <div id="doing"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="column">
          <h4>✅ Done</h4>
          <div id="done"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
